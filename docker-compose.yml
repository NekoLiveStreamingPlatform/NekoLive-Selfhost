services:
  nekolive-selfhost:
    image: ghcr.io/nekolivestreamingplatform/nekolive-selfhost:latest
    container_name: nekolive-selfhost
    ports:
      - "8090:8090"
    volumes:
      # Mount only the mutable runtime config file. Mounting the entire
      # ./config directory would hide /app/config/loader.js shipped in the
      # image and cause the app to crash with MODULE_NOT_FOUND.
      - ./config/config.json:/app/config/config.json:ro
      - ./data:/app/data
    restart: unless-stopped
  ome:
    image: airensoft/ovenmediaengine:latest
    container_name: ome
    restart: unless-stopped
    env_file:
      - .env
    expose:
      # Internal HTTP endpoints consumed by nekolive-selfhost over the Docker
      # network. They do not need separate public host ports/domains.
      - "3333"
      - "8080"
      - "8081"
      - "1935"
      - "9999/udp"
    ports:
      - 9077:9000/tcp
      - 1935:1935/tcp
      - 9999:9999/udp
      - 3478:3478/tcp
      - 10000-10004:10000-10004/udp
    volumes:
      - ./ome/Server.xml:/opt/ovenmediaengine/bin/origin_conf/Server.xml
